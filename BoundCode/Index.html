<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FMR Tracker</title>
    <?!= include('Styles'); ?>
    <?!= include('ImportStyles'); ?>
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1 id="pageTitle">FMR Tracker</h1>
        <p id="pageSubtitle" class="muted">Loading…</p>
      </div>
      <nav class="app-nav" aria-label="Portal views">
        <a id="fieldNav" href="?view=field">Field</a>
        <a id="adminNav" href="?view=admin">Admin</a>
        <a id="importNav" href="?view=import">Import</a>
      </nav>
    </header>

    <div id="globalError" class="alert alert-error hidden" role="alert"></div>
    <div id="globalSuccess" class="alert alert-success hidden" role="status"></div>

    <main>
      <section id="fieldView" class="view hidden">
        <div class="toolbar">
          <label>ISO Line
            <input id="fieldLineNumber" type="text" autocomplete="off">
          </label>
          <label>ISO Sheet
            <input id="fieldSheetNumber" type="text" autocomplete="off">
          </label>
          <button id="fieldSearchButton" type="button">Search</button>
        </div>
        <p id="fieldPermissionNote" class="muted"></p>
        <div class="status-row">
          <span id="fieldStatus"></span>
          <span id="fieldLastRefreshed" class="muted"></span>
        </div>
        <div id="fieldResults"></div>
      </section>

      <section id="adminView" class="view hidden">
        <div class="toolbar admin-filters">
          <label>FMR Number
            <input id="filterFmrNumber" type="text" autocomplete="off">
          </label>
          <label>IWP
            <input id="filterIwp" type="text" list="iwpOptions" autocomplete="off">
          </label>
          <datalist id="iwpOptions"></datalist>
          <label>ISO Line
            <input id="filterIsoLine" type="text" autocomplete="off">
          </label>
          <label>ISO Sheet
            <input id="filterIsoSheet" type="text" autocomplete="off">
          </label>
          <label>Status
            <select id="filterStatus">
              <option value="">All statuses</option>
            </select>
          </label>
          <label>Commodity
            <input id="filterCommodity" type="text" autocomplete="off">
          </label>
          <div class="toolbar-actions">
            <button id="adminSearchButton" type="button">Search</button>
            <button id="adminRefreshButton" type="button" class="secondary">Refresh</button>
            <button id="adminClearButton" type="button" class="secondary">Clear</button>
          </div>
        </div>

        <div id="kpiGrid" class="kpi-grid"></div>
        <div class="status-row">
          <span id="adminResultStatus"></span>
          <span id="lastRefreshed" class="muted"></span>
        </div>
        <div id="adminFmrResults"></div>

        <section class="queue-section">
          <h2>Pending Backorders <span id="backorderCount" class="count-pill">0</span></h2>
          <div id="backorderQueue"></div>
        </section>

        <section class="queue-section">
          <h2>Active Bag Tags <span id="bagTagCount" class="count-pill">0</span></h2>
          <div id="bagTagQueue"></div>
        </section>
      </section>

      <section id="importView" class="view hidden">
        <div class="import-toolbar">
          <div class="import-meta">
            <div><span class="muted">Signed in as</span> <strong id="importUserEmail">—</strong></div>
          </div>

          <div class="toolbar">
            <label>Batch
              <select id="importBatchSelect"></select>
            </label>
            <label>Status
              <select id="importStatusFilter"></select>
            </label>
            <label>Name filter
              <input id="importNameFilter" type="text" autocomplete="off">
            </label>
            <label>Chunk size
              <input id="importChunkSize" type="number" min="1" max="25" value="5">
            </label>
          </div>

          <div class="toolbar-actions import-actions">
            <button id="importDiscoverButton" type="button">Discover Files</button>
            <button id="importProcessChunkButton" type="button">Process Chunk</button>
            <button id="importProcessSelectedButton" type="button">Process Selected</button>
            <button id="importRetrySelectedButton" type="button" class="secondary">Retry Selected</button>
            <button id="importCancelSelectedButton" type="button" class="danger">Cancel Selected</button>
            <button id="importRefreshButton" type="button" class="secondary">Refresh</button>
            <button id="importOpenFolderButton" type="button" class="secondary">Open Source Folder</button>
            <button id="importOpenStagingButton" type="button" class="secondary">Open Staging</button>
            <button id="importOpenQueueButton" type="button" class="secondary">Open Queue</button>
          </div>
        </div>

        <p id="importOperationStatus" class="muted"></p>
        <div id="importBatchSummary" class="import-summary-grid"></div>

        <div class="import-queue-header">
          <div>
            <h2>Import Queue</h2>
            <p id="importQueueCaption" class="muted"></p>
          </div>
          <div class="toolbar-actions">
            <span id="importSelectedCount" class="muted">0 selected</span>
            <button id="importClearSelectionButton" type="button" class="secondary">Clear Selection</button>
          </div>
        </div>

        <div id="importQueueEmpty" class="empty-state">No import queue records were found for this batch.</div>
        <div id="importQueueTableWrap" class="table-wrap hidden">
          <table class="import-queue-table">
            <thead>
              <tr>
                <th class="import-check-column">
                  <input id="importSelectAll" type="checkbox" aria-label="Select all visible imports">
                </th>
                <th>Status</th>
                <th>Source</th>
                <th>Method</th>
                <th>FMR</th>
                <th>IWP / ISO</th>
                <th>Confidence</th>
                <th>Warnings</th>
              </tr>
            </thead>
            <tbody id="importQueueBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="actionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="actionTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="actionTitle">Field Action</h2>
          <button id="actionCloseButton" type="button" class="secondary small" aria-label="Close">Close</button>
        </div>
        <p id="actionContext" class="muted"></p>
        <form id="actionForm">
          <div id="actionFields"></div>
          <p id="actionStatus" class="muted"></p>
          <div class="modal-actions">
            <button id="actionCancelButton" type="button" class="secondary">Cancel</button>
            <button id="actionSubmitButton" type="submit">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const REQUESTED_VIEW = '<?= REQUESTED_VIEW ?>';
    </script>
    <?!= include('Client'); ?>
    <?!= include('ImportClient'); ?>
  </body>
</html>
