<style>
  :root {
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
    background: #edf3f8;
    --navy: #17365d;
    --blue: #1f4e78;
    --light-blue: #d9eaf7;
    --border: #d6e0ea;
    --muted: #64748b;
    --success: #16794b;
    --warning: #a15c00;
    --danger: #b42318;
  }

  * { box-sizing: border-box; }

  body { margin: 0; }

  .shell {
    max-width: 1500px;
    margin: 0 auto;
    padding: 22px;
  }

  .hidden { display: none !important; }

  .topbar,
  .section-heading,
  .refresh-area,
  .button-row,
  .field-refresh-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .topbar {
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-heading {
    justify-content: space-between;
  }

  .section-heading.compact {
    margin-bottom: 12px;
  }

  .field-refresh-row {
    justify-content: space-between;
    margin: -5px 3px 13px;
  }

  h1 {
    margin: 0 0 6px;
    color: var(--navy);
    font-size: clamp(28px, 4vw, 42px);
  }

  h2 {
    margin: 0;
    color: #172033;
  }

  p {
    margin: 5px 0;
    color: var(--muted);
  }

  .view-nav {
    display: flex;
    gap: 8px;
  }

  .view-nav a {
    text-decoration: none;
    color: var(--blue);
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 700;
  }

  .view-nav a.active {
    background: var(--blue);
    color: white;
  }

  .panel,
  .fmr-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04);
  }

  .search-panel {
    display: grid;
    gap: 14px;
    align-items: end;
  }

  .field-search {
    grid-template-columns: minmax(280px, 1fr) 180px 130px;
  }

  .admin-filters {
    display: grid;
    grid-template-columns: repeat(3, minmax(190px, 1fr));
    gap: 14px;
    margin-top: 14px;
  }

  label {
    display: grid;
    gap: 6px;
    font-weight: 700;
    color: #253247;
  }

  input,
  select,
  textarea {
    width: 100%;
    font: inherit;
    padding: 11px 12px;
    border: 1px solid #9fb3c8;
    border-radius: 7px;
    background: white;
  }

  textarea {
    min-height: 88px;
    resize: vertical;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 3px solid rgba(31, 78, 120, 0.15);
    border-color: var(--blue);
  }

  button {
    padding: 12px 17px;
    border: 0;
    border-radius: 7px;
    background: var(--blue);
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  button:hover {
    filter: brightness(0.95);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  button.secondary {
    background: #e9eff5;
    color: #24364c;
    border: 1px solid #cbd8e5;
  }

  button.danger {
    background: var(--danger);
  }

  button.warning {
    background: var(--warning);
  }

  button.success-button {
    background: var(--success);
  }

  button.small {
    padding: 8px 10px;
    font-size: 12px;
  }

  .icon-button {
    background: transparent;
    color: #334155;
    font-size: 28px;
    line-height: 1;
    padding: 3px 8px;
  }

  .button-row {
    margin-top: 15px;
    flex-wrap: wrap;
  }

  .status-text,
  .muted {
    color: var(--muted);
    font-size: 13px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .kpi {
    background: white;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 15px;
  }

  .kpi-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .kpi-value {
    color: var(--navy);
    font-size: 27px;
    font-weight: 800;
    margin-top: 4px;
  }

  .admin-grid {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(330px, 0.85fr);
    gap: 16px;
    align-items: start;
  }

  aside {
    position: sticky;
    top: 12px;
  }

  .fmr-title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .fmr-card h3 {
    margin: 0 0 6px;
    font-size: 23px;
    color: #172033;
  }

  .fmr-meta {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
  }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(7, minmax(75px, 1fr));
    gap: 8px;
    margin: 14px 0;
  }

  .summary-cell {
    background: #f5f8fb;
    border-radius: 7px;
    padding: 8px;
    text-align: center;
  }

  .summary-cell span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
  }

  .summary-cell strong {
    display: block;
    font-size: 16px;
    margin-top: 2px;
  }

  .badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    background: #e8f1f9;
    color: var(--blue);
    font-size: 12px;
    font-weight: 700;
  }

  .badge.warn {
    background: #fff3d9;
    color: #8a5100;
  }

  .badge.success {
    background: #dff4e9;
    color: #11653d;
  }

  .badge.danger {
    background: #fee4e2;
    color: var(--danger);
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    min-width: 1000px;
  }

  th,
  td {
    text-align: left;
    border-bottom: 1px solid #dde5ed;
    padding: 9px;
    vertical-align: top;
  }

  th {
    background: var(--light-blue);
    font-size: 12px;
  }

  td {
    font-size: 13px;
  }

  .material-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag-summary {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
    line-height: 1.5;
  }

  .queue-panel {
    padding: 15px;
  }

  .queue-item {
    border: 1px solid #dde5ed;
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fbfdff;
  }

  .queue-title {
    font-weight: 800;
    margin-bottom: 4px;
    color: #18263a;
  }

  .queue-meta {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }

  .queue-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .count-pill {
    min-width: 26px;
    text-align: center;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--blue);
    color: white;
    font-size: 12px;
    font-weight: 700;
  }

  .empty-state {
    color: var(--muted);
    padding: 12px 0;
    font-size: 13px;
  }

  .alert {
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  .alert.error {
    background: #fee4e2;
    color: var(--danger);
    border: 1px solid #f6b8b4;
  }

  .alert.success {
    background: #dff4e9;
    color: #11653d;
    border: 1px solid #a9dec3;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.62);
    display: grid;
    place-items: center;
    padding: 18px;
    z-index: 1000;
  }

  .modal-card {
    width: min(650px, 100%);
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 13px;
    padding: 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
  }

  .action-fields {
    display: grid;
    gap: 13px;
    margin-top: 16px;
  }

  .action-hint {
    background: #f5f8fb;
    border: 1px solid #dce6ef;
    border-radius: 7px;
    padding: 10px;
    color: #425466;
    font-size: 13px;
  }

  .modal-actions {
    justify-content: flex-end;
  }

  @media (max-width: 1100px) {
    .admin-grid {
      grid-template-columns: 1fr;
    }

    aside {
      position: static;
    }

    .kpi-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  @media (max-width: 760px) {
    .shell {
      padding: 14px;
    }

    .topbar {
      flex-direction: column;
    }

    .field-search,
    .admin-filters {
      grid-template-columns: 1fr;
    }

    .kpi-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .summary-strip {
      grid-template-columns: repeat(3, 1fr);
    }

    .field-refresh-row {
      flex-direction: column;
      align-items: flex-start;
    }
  }

  /*
   * Admin layout v3
   *
   * The page remains the primary vertical scroll container.
   * FMR Results stay in normal document flow.
   * The operational rail remains visible, while each queue scrolls
   * only when its contents exceed the available rail height.
   */

  @media (min-width: 901px) {
    .admin-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(360px, 430px);
      gap: 16px;
      align-items: start;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    /*
     * Left column uses the page scrollbar.
     * This avoids a nested FMR Results scroll trap.
     */
    .admin-grid > div {
      min-width: 0;
      height: auto;
      display: block;
      overflow: visible;
    }

    #adminFmrResults {
      height: auto;
      min-height: 0;
      max-height: none;
      overflow: visible;
      padding-right: 0;
    }

    /*
     * The right rail remains visible while the page scrolls.
     */
    .admin-grid > aside {
      position: sticky;
      top: 12px;
      align-self: start;
      min-width: 0;
      min-height: 0;
      height: calc(100vh - 24px);
      height: calc(100dvh - 24px);
      display: grid;
      grid-template-rows:
        minmax(0, 1fr)
        minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
      padding-right: 2px;
    }

    .admin-grid > aside .queue-panel {
      min-width: 0;
      min-height: 0;
      height: 100%;
      margin: 0;
      display: grid;
      grid-template-rows:
        auto
        minmax(0, 1fr);
      overflow: hidden;
    }

    .admin-grid > aside .queue-panel > .section-heading {
      min-height: 0;
    }

    /*
     * Only queue contents scroll internally.
     * Default scroll chaining allows the page to resume scrolling
     * once an internal queue reaches its top or bottom boundary.
     */
    #backorderQueue,
    #bagTagQueue {
      min-width: 0;
      min-height: 0;
      height: 100%;
      max-height: none;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;
      scrollbar-gutter: stable;
      padding-right: 4px;
    }
  }

  /*
   * Tablet and mobile:
   * Return all content to normal document flow.
   */
  @media (max-width: 900px) {
    .admin-grid {
      grid-template-columns: 1fr;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    .admin-grid > div,
    .admin-grid > aside,
    .admin-grid > aside .queue-panel {
      position: static;
      height: auto;
      min-height: 0;
      max-height: none;
      display: block;
      overflow: visible;
    }

    .admin-grid > aside .queue-panel {
      margin-bottom: 16px;
    }

    #adminFmrResults,
    #backorderQueue,
    #bagTagQueue {
      height: auto;
      min-height: 0;
      max-height: none;
      overflow: visible;
    }
  }
</style>
