<style>
  :root {
    --bg: #f3f1ec;
    --surface: #fffdf8;
    --ink: #1f2a24;
    --muted: #5f6b64;
    --line: #d7ddd7;
    --accent: #1f6b4a;
    --accent-strong: #154c35;
    --warn: #9a6b16;
    --danger: #8f2d2d;
    --success: #1f6b4a;
    --shadow: 0 10px 30px rgba(31, 42, 36, 0.08);
    --radius: 14px;
    --font: "IBM Plex Sans", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(31, 107, 74, 0.08), transparent 28%),
      linear-gradient(180deg, #f7f5f0 0%, var(--bg) 100%);
    min-height: 100vh;
  }

  .hidden { display: none !important; }

  .app-header {
    display: flex;
    justify-content: space-between;
    gap: 1.5rem;
    align-items: flex-end;
    padding: 1.5rem 1.75rem 1rem;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 253, 248, 0.88);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .app-header h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: -0.03em;
  }

  .app-header p {
    margin: 0.35rem 0 0;
  }

  .app-nav {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .app-nav a {
    text-decoration: none;
    color: var(--muted);
    padding: 0.55rem 0.9rem;
    border: 1px solid transparent;
    border-radius: 999px;
  }

  .app-nav a.active,
  .app-nav a:hover {
    color: var(--accent-strong);
    border-color: rgba(31, 107, 74, 0.25);
    background: rgba(31, 107, 74, 0.08);
  }

  main {
    padding: 1.25rem 1.75rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .muted { color: var(--muted); }

  .alert {
    margin: 1rem 1.75rem 0;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--line);
  }

  .alert-error {
    background: #fceeee;
    border-color: #e7bcbc;
    color: var(--danger);
  }

  .alert-success {
    background: #eef7f1;
    border-color: #bfdccb;
    color: var(--success);
  }

  .toolbar,
  .toolbar-actions,
  .admin-filters,
  .import-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: end;
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    font-size: 0.85rem;
    color: var(--muted);
    min-width: 140px;
  }

  input,
  select,
  textarea,
  button {
    font: inherit;
  }

  input,
  select,
  textarea {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.65rem 0.75rem;
    background: #fff;
    color: var(--ink);
  }

  textarea { min-height: 90px; resize: vertical; }

  button {
    border: 0;
    border-radius: 10px;
    padding: 0.7rem 1rem;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }

  button:hover { background: var(--accent-strong); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  button.secondary {
    background: #edf0ec;
    color: var(--ink);
  }

  button.secondary:hover { background: #e1e6e0; }

  button.warning { background: var(--warn); }
  button.danger { background: var(--danger); }
  button.success-button { background: var(--success); }
  button.small { padding: 0.4rem 0.7rem; font-size: 0.85rem; }

  .status-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin: 1rem 0;
    flex-wrap: wrap;
  }

  .panel,
  .fmr-card,
  .queue-item,
  .kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .panel,
  .empty-state {
    padding: 1.25rem;
  }

  .empty-state {
    color: var(--muted);
    background: rgba(255, 253, 248, 0.7);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  .fmr-card,
  .queue-item {
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }

  .fmr-title-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: flex-start;
  }

  .fmr-title-row h3 {
    margin: 0;
    font-size: 1.15rem;
  }

  .fmr-meta {
    margin-top: 0.35rem;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    background: #edf0ec;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .badge.success { background: #dff0e6; color: var(--success); }
  .badge.danger { background: #f6e2e2; color: var(--danger); }
  .badge.warn { background: #f7ecd7; color: var(--warn); }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.6rem;
    margin: 1rem 0;
  }

  .summary-cell {
    background: #f4f7f4;
    border-radius: 10px;
    padding: 0.65rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .summary-cell span {
    color: var(--muted);
    font-size: 0.75rem;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.92rem;
  }

  th,
  td {
    text-align: left;
    padding: 0.65rem 0.5rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .material-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .tag-summary {
    margin-top: 0.45rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0 1.25rem;
  }

  .kpi {
    padding: 0.9rem 1rem;
  }

  .kpi-label {
    color: var(--muted);
    font-size: 0.8rem;
  }

  .kpi-value {
    margin-top: 0.35rem;
    font-size: 1.35rem;
    font-weight: 650;
  }

  .queue-section {
    margin-top: 2rem;
  }

  .queue-section h2 {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-size: 1.1rem;
  }

  .count-pill {
    display: inline-flex;
    min-width: 1.6rem;
    justify-content: center;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    background: #edf0ec;
    font-size: 0.85rem;
  }

  .queue-title {
    font-weight: 650;
    margin-bottom: 0.35rem;
  }

  .queue-meta {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 0.35rem;
  }

  .queue-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-top: 0.75rem;
  }

  .action-hint {
    margin-top: 0.75rem;
    padding: 0.75rem;
    border-radius: 10px;
    background: #f4f7f4;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(18, 28, 23, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 50;
  }

  .modal-card {
    width: min(560px, 100%);
    background: var(--surface);
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    max-height: 90vh;
    overflow: auto;
  }

  .modal-header,
  .modal-actions {
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    align-items: center;
  }

  .modal-actions {
    justify-content: flex-end;
    margin-top: 1rem;
  }

  #actionFields {
    display: grid;
    gap: 0.85rem;
    margin-top: 1rem;
  }

  @media (max-width: 800px) {
    .app-header,
    main,
    .alert {
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .app-header {
      flex-direction: column;
      align-items: flex-start;
    }

    label { min-width: 100%; }
  }
</style>
